[env:uno]
platform = atmelavr
platform_packages =
    platformio/tool-clangtidy
board = uno
framework = arduino
lib_deps = olikraus/U8g2
check_tool = clangtidy, cppcheck
check_flags =
    clangtidy: --config-file=.clang-tidy --header-filter=^(${platformio.src_dir}|${platformio.include_dir})/
    cppcheck: --enable=all --inconclusive --suppress=*:*.pio/* --suppress=*:*.platformio/*
    cppcheck: --suppress=unmatchedSuppression --cppcheck-build-dir=.pio/cppcheck
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wconversion
    -Wsign-conversion
    -Wshadow
    -Wformat=2
    -Wundef
