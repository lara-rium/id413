<script>
  const element = id => document.getElementById(id);
  let playback = new AbortController();
  async function wait(milliseconds) {
    const signal = playback.signal;
    await new Promise(resolve => setTimeout(resolve, milliseconds));
    signal.throwIfAborted();
  }
  const resize = () => document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1600, innerHeight / 900));
  addEventListener('resize', resize);
  resize();

  // awaiting each animation keeps commas sequential; promise.all runs plus signs together.
  async function animate(id, frames, duration, easing = 'cubic-bezier(.16, 1, .3, 1)') {
    const target = element(id);
    target.hidden = false;
    if (id === 'world') prepareGlobe();
    await target.animate(frames, { duration, easing, fill: 'forwards' }).finished;
  }

  async function type(id, text, interval) {
    const target = element(id);
    for (const character of text) {
      await wait(interval);
      target.textContent += character;
    }
  }

  function shake(strength = 15) {
    return animate('content', [
      { transform: 'translate(0, 0)' },
      { transform: `translate(${-strength}px, ${strength / 2}px)` },
      { transform: `translate(${strength}px, ${-strength / 2}px)` },
      { transform: `translate(${-strength / 2}px, ${strength / 3}px)` },
      { transform: `translate(${strength / 3}px, 0)` },
      { transform: 'translate(0, 0)' }
    ], 380, 'linear');
  }

  // a standard windows layout keeps every fingertip tied to an actual keycap.
  const key = (id, label = id, units = 1) => ({ id, label, units });
  const letters = text => [...text].map(letter => key(`Key${letter}`, letter));
  const spacer = units => key('', '', units);
  const keyRows = [
    [key('Escape', 'esc'), spacer(1), ...Array.from({ length: 4 }, (_, index) => key(`F${index + 1}`)), spacer(.5), ...Array.from({ length: 4 }, (_, index) => key(`F${index + 5}`)), spacer(.5), ...Array.from({ length: 4 }, (_, index) => key(`F${index + 9}`))],
    [key('Backquote', '`'), ...letters('1234567890'), key('Minus', '−'), key('Equal', '='), key('Backspace', 'backspace', 2)],
    [key('Tab', 'tab', 1.5), ...letters('QWERTYUIOP'), key('BracketLeft', '['), key('BracketRight', ']'), key('Backslash', '\\', 1.5)],
    [key('CapsLock', 'caps lock', 1.75), ...letters('ASDFGHJKL'), key('Semicolon', ';'), key('Quote', "'"), key('Enter', 'enter', 2.25)],
    [key('ShiftLeft', 'shift', 2.25), ...letters('ZXCVBNM'), key('Comma', ','), key('Period', '.'), key('Slash', '/'), key('ShiftRight', 'shift', 2.75)],
    [key('ControlLeft', 'ctrl', 1.25), key('MetaLeft', '⊞', 1.25), key('AltLeft', 'alt', 1.25), key('Space', '', 6.25), key('AltRight', 'alt', 1.25), key('MetaRight', '⊞', 1.25), key('ContextMenu', '☰', 1.25), key('ControlRight', 'ctrl', 1.25)]
  ];
  const navigationRows = [
    [key('PrintScreen', 'print'), key('ScrollLock', 'scroll'), key('Pause', 'pause')],
    [key('Insert', 'ins'), key('Home', 'home'), key('PageUp', 'pg up')],
    [key('Delete', 'del'), key('End', 'end'), key('PageDown', 'pg dn')],
    [spacer(3)],
    [spacer(1), key('ArrowUp', '↑'), spacer(1)],
    [key('ArrowLeft', '←'), key('ArrowDown', '↓'), key('ArrowRight', '→')]
  ];
  const keyElements = new Map();
  for (const rows of [keyRows, navigationRows]) {
    const bank = document.createElement('div');
    bank.className = 'key-bank';
    for (const keys of rows) {
      const row = document.createElement('div');
      row.className = 'key-row';
      for (const { id, label, units } of keys) {
        const keycap = document.createElement('div');
        keycap.className = id ? 'key' : 'key spacer';
        keycap.style.width = `${units * 58 + (units - 1) * 8}px`;
        const legend = document.createElement('span');
        legend.textContent = label;
        keycap.append(legend);
        row.append(keycap);
        if (id) {
          keycap.dataset.key = id;
          keyElements.set(id, keycap);
        }
      }
      bank.append(row);
    }
    element('key-layout').append(bank);
  }

  // five articulated fingers share one palm; only the fingers in a chord touch its keys.
  const fingerRoots = [[-72, -43], [-35, -65], [5, -73], [44, -59], [78, -9]];
  const restingTips = [[-89, -126], [-43, -172], [5, -188], [52, -169], [127, -51]];
  const svgNamespace = 'http://www.w3.org/2000/svg';
  const fingers = fingerRoots.map(() => {
    const paths = ['finger-outline', 'finger-skin'].map(className => {
      const path = document.createElementNS(svgNamespace, 'path');
      path.setAttribute('class', className);
      element('fingers').append(path);
      return path;
    });
    const nail = document.createElementNS(svgNamespace, 'rect');
    for (const [name, value] of Object.entries({ class: 'fingernail', width: 14, height: 18, rx: 5 })) nail.setAttribute(name, value);
    element('fingernails').append(nail);
    return { paths, nail };
  });
  let handPose;
  function drawHand(pose) {
    handPose = pose;
    for (const id of ['wrist', 'palm']) element(id).setAttribute('transform', `translate(${pose.x} ${pose.y})`);
    fingers.forEach(({ paths, nail }, index) => {
      const root = { x: pose.x + fingerRoots[index][0], y: pose.y + fingerRoots[index][1] };
      const tip = pose.tips[index];
      const path = `M${root.x} ${root.y} C${root.x} ${root.y - 55} ${tip.x} ${tip.y + 60} ${tip.x} ${tip.y}`;
      for (const part of paths) part.setAttribute('d', path);
      nail.setAttribute('x', tip.x - 7);
      nail.setAttribute('y', tip.y - 5);
    });
  }
  function restingHand(x, y) {
    return { x, y, tips: restingTips.map(([offsetX, offsetY]) => ({ x: x + offsetX, y: y + offsetY })) };
  }
  function keyPosition(id) {
    const stage = element('stage').getBoundingClientRect();
    const keycap = keyElements.get(id).getBoundingClientRect();
    const scale = stage.width / 1600;
    return { x: (keycap.x + keycap.width / 2 - stage.x) / scale, y: (keycap.y + keycap.height / 2 - stage.y) / scale + 4 };
  }
  async function moveHand(keys, duration) {
    const positions = keys.map(keyPosition);
    const x = (Math.min(...positions.map(point => point.x)) + Math.max(...positions.map(point => point.x))) / 2 + 30;
    const y = Math.min(780, Math.max(650, Math.max(...positions.map(point => point.y)) + 115));
    const target = restingHand(x, y);
    keys.forEach((id, index) => {
      const finger = id === 'ControlLeft' ? 0 : id === 'ShiftLeft' ? 1 : id === 'MetaLeft' ? 4 : id === 'AltLeft' ? (keys.includes('MetaLeft') ? 1 : 4) : 3;
      target.tips[finger] = positions[index];
    });
    const start = handPose;
    const signal = playback.signal;
    const started = performance.now();
    await new Promise((resolve, reject) => {
      function frame(now) {
        if (signal.aborted) return reject(signal.reason);
        const progress = Math.min(1, (now - started) / duration);
        const amount = progress * progress * (3 - 2 * progress);
        const mix = (from, to) => from + (to - from) * amount;
        drawHand({ x: mix(start.x, target.x), y: mix(start.y, target.y), tips: start.tips.map((tip, index) => ({ x: mix(tip.x, target.tips[index].x), y: mix(tip.y, target.tips[index].y) })) });
        if (progress < 1) requestAnimationFrame(frame);
        else resolve();
      }

      state.phi = longitude;
    }
    });
  }

  addEventListener('click', advance);
  addEventListener('keydown', event => {
    if (event.code === 'ArrowLeft') {
      event.preventDefault();
      if (!event.repeat) previous();
    }
    if (['Space', 'ArrowRight', 'Enter', 'PageDown'].includes(event.code)) {
      event.preventDefault();
      if (!event.repeat) advance();
    }
  });
</script>
</body>
</html>
